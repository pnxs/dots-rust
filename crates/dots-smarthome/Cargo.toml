[package]
name = "dots-smarthome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Smart-home example client (port of dots-cpp/bin/examples/smart-home)."

[[bin]]
name = "smart-home"
path = "src/main.rs"

[[bin]]
name = "smart-home-sim"
path = "src/sim.rs"

[dependencies]
dots-rs = { workspace = true, features = ["tracing-init"] }

tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "time", "sync"] }
tracing.workspace = true

[build-dependencies]
dots-rs-build.workspace = true

[lints]
workspace = true
